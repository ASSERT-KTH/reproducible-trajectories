[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reproducible-trajectories"
version = "0.1.0"
description = "Tooling for capturing, analyzing, and verifying AI coding agent trajectories"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Martin Monperrus" },
]
requires-python = ">=3.8"
dependencies = ["trajectoriz>=0.26.0"]

[project.urls]
Homepage = "https://github.com/ASSERT-KTH/reproducible-trajectories"
Repository = "https://github.com/ASSERT-KTH/reproducible-trajectories"

[project.scripts]
reproducible-trajectories = "reproducible_trajectories.trajectory:main"
pre-commit-verify-trajectory = "reproducible_trajectories.trajectory:pre_commit_verify_trajectory"
pre-commit-collect-trajectories = "reproducible_trajectories.hooks.collect_trajectories:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["reproducible_trajectories*"]
